name: CI/CD
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  terraform:
    permissions:
      contents: read
      pull-requests: write
    uses: 13SOAT-andromeda/tech-andromeda-ci-config/.github/workflows/reusable-terraform-cd.yml@v1
    with:
      terraform-dir: prod
      run-tests: true
      datadog-api-key-var-name: datadog_api_key
    secrets: inherit

  apply-ingress:
    needs: terraform
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws-prod
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: 13SOAT-andromeda/tech-andromeda-ci-config/actions/configure-aws-session@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name video-processor-eks-prod
      - name: Install/upgrade AWS Load Balancer Controller
        run: |
          VPC_ID=$(aws eks describe-cluster --name video-processor-eks-prod --query 'cluster.resourcesVpcConfig.vpcId' --output text)

          kubectl delete secret aws-alb-credentials -n kube-system --ignore-not-found
          kubectl create secret generic aws-alb-credentials -n kube-system \
            --from-literal=AWS_ACCESS_KEY_ID="$AWS_ACCESS_KEY_ID" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$AWS_SECRET_ACCESS_KEY" \
            --from-literal=AWS_SESSION_TOKEN="$AWS_SESSION_TOKEN" \
            --from-literal=AWS_REGION="$AWS_REGION"

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update eks
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            -n kube-system \
            --set clusterName=video-processor-eks-prod \
            --set serviceAccount.create=true \
            --set region="$AWS_REGION" \
            --set vpcId="$VPC_ID" \
            --set "envFrom[0].secretRef.name=aws-alb-credentials" \
            --wait
      - name: Apply shared ALB ingress
        run: kubectl apply -f k8s/ingress.yaml
      - name: Wait for ALB to be provisioned
        run: |
          for _ in $(seq 1 30); do
            ADDR=$(kubectl get ingress video-processor-ingress -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$ADDR" ]; then
              echo "ALB ready: $ADDR"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::ALB not provisioned within 5 minutes — check the AWS Load Balancer Controller logs"
