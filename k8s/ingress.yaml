apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-processor-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: video-processor/alb=unified
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: video-processor-users-api-svc
                port:
                  number: 80
          # Nota: fica /links (sem prefixo /api, diferente de /api/users) de
          # propósito — o link-api expõe as rotas reais em /links, /links/:id
          # etc (confirmado em testes ponta a ponta), sem prefixo /api. Se o
          # padrão /api/* virar obrigatório pra todo serviço, o link-api
          # precisa mudar suas próprias rotas Gin primeiro, senão o Ingress
          # manda tráfego pra um path que o pod não reconhece (404 em tudo).
          - path: /links
            pathType: Prefix
            backend:
              service:
                name: video-processor-link-api-svc
                port:
                  number: 80
