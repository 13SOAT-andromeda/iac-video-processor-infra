apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: video-processor-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/tags: video-processor/alb=unified
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: video-processor-users-api-svc
                port:
                  number: 80
          # /api/links: o link-api já registra as próprias rotas Gin sob
          # /api/links/... (mesma convenção do /api/users), então o Ingress
          # bate certo com o que o pod entende.
          - path: /api/links
            pathType: Prefix
            backend:
              service:
                name: video-processor-link-api-svc
                port:
                  number: 80
